<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Local Visibility Lab — Dashboard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#e0f2fe',
              500: '#039BE5',
              600: '#0284c7',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#0a0a0b] text-white min-h-screen antialiased selection:bg-brand-500 selection:text-white">

  <div id="root"></div>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    function App() {
      const [activeTab, setActiveTab] = React.useState('overview');

      return (
        <div className="flex flex-col min-h-screen bg-[#0a0a0b] bg-[linear-gradient(rgba(255,255,255,0.02)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.02)_1px,transparent_1px)] bg-[size:32px_32px]">
          
          {/* Header */}
          <header className="border-b border-white/10 bg-[#0a0a0b]/90 backdrop-blur sticky top-0 z-50">
            <div className="max-w-[1280px] mx-auto px-6 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-[#039BE5] to-[#7dd3ff] flex items-center justify-center font-bold text-black shadow-[0_0_20px_rgba(3,155,229,0.4)]">
                  LV
                </div>
                <span className="font-bold text-lg tracking-tight bg-gradient-to-r from-white via-white to-white/60 bg-clip-text text-transparent">
                  The Local Visibility Lab
                </span>
              </div>

              <nav className="hidden md:flex items-center gap-1 bg-white/[0.04] p-1 rounded-full border border-white/10">
                {['overview', 'audits', 'virtual-tours', 'leads'].map((tab) => (
                  <button
                    key={tab}
                    onClick={() => setActiveTab(tab)}
                    className={`px-4 py-1.5 rounded-full text-xs font-medium transition-all capitalize ${
                      activeTab === tab
                        ? 'bg-[#039BE5] text-black font-semibold shadow-[0_0_15px_rgba(3,155,229,0.3)]'
                        : 'text-white/70 hover:text-white hover:bg-white/5'
                    }`}
                  >
                    {tab.replace('-', ' ')}
                  </button>
                ))}
              </nav>

              <div className="flex items-center gap-3">
                <span className="hidden sm:inline-block text-xs px-3 py-1 rounded-full bg-[#039BE5]/10 text-[#039BE5] border border-[#039BE5]/30">
                  Active Region: Bengaluru
                </span>
                <div className="w-8 h-8 rounded-full bg-white/10 border border-white/20 flex items-center justify-center font-semibold text-xs text-white">
                  SP
                </div>
              </div>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="flex-1 max-w-[1280px] w-full mx-auto px-6 py-8">
            <div className="mb-8">
              <h1 className="text-2xl md:text-3xl font-extrabold tracking-tight text-white mb-2">
                Welcome back, Sanjay
              </h1>
              <p className="text-sm text-white/60">
                Here is your live performance overview across local search optimization and 360° virtual tour engagements.
              </p>
            </div>

            {/* Metric Cards Grid */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
              {[
                { title: 'Google Business Audits', value: '54+', change: '+12% this month', color: 'from-[#039BE5]/20 to-transparent' },
                { title: '360° Tours Deployed', value: '2,100+', change: 'Across 7+ States', color: 'from-emerald-500/20 to-transparent' },
                { title: 'Local Search Visibility', value: '94.8%', change: 'Top 3 Map Pack', color: 'from-purple-500/20 to-transparent' },
                { title: 'Client Engagement Rate', value: '4.9/5', change: 'Based on 50+ reviews', color: 'from-amber-500/20 to-transparent' },
              ].map((card, i) => (
                <div key={i} className={`relative p-5 rounded-2xl bg-gradient-to-br ${card.color} border border-white/10 backdrop-blur overflow-hidden`}>
                  <div className="text-xs font-medium text-white/60 mb-1">{card.title}</div>
                  <div className="text-3xl font-extrabold text-white mb-2">{card.value}</div>
                  <div className="text-xs text-[#7dd3ff] flex items-center gap-1">
                    <span>{card.change}</span>
                  </div>
                </div>
              ))}
            </div>

            {/* Interactive Section / Quick Actions */}
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <div className="lg:col-span-2 p-6 rounded-2xl bg-[#141416] border border-white/10">
                <h3 className="text-base font-semibold text-white mb-4">Active Client Pipeline</h3>
                <div className="space-y-3">
                  {[
                    { name: 'Maple Leaf International School', type: '360° Virtual Tour & Map Pack', status: 'In Review', date: 'Today' },
                    { name: 'Sri Venkateshwara Enterprises', type: 'Local SEO & GBP Optimization', status: 'Completed', date: 'Yesterday' },
                    { name: 'Zenith Tech Solutions', type: 'Geo-targeted Landing Page', status: 'In Progress', date: 'Active' },
                  ].map((client, idx) => (
                    <div key={idx} className="flex items-center justify-between p-4 rounded-xl bg-white/[0.03] border border-white/5 hover:border-white/15 transition-all">
                      <div>
                        <div className="font-semibold text-sm text-white mb-0.5">{client.name}</div>
                        <div className="text-xs text-white/50">{client.type}</div>
                      </div>
                      <div className="text-right">
                        <span className={`inline-block px-2.5 py-1 rounded-full text-[10px] font-semibold mb-1 ${
                          client.status === 'Completed' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-[#039BE5]/10 text-[#039BE5] border border-[#039BE5]/30'
                        }`}>
                          {client.status}
                        </span>
                        <div className="text-[10px] text-white/40">{client.date}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="p-6 rounded-2xl bg-[#141416] border border-white/10 flex flex-col justify-between">
                <div>
                  <h3 className="text-base font-semibold text-white mb-2">Quick Actions</h3>
                  <p className="text-xs text-white/60 mb-6">Launch new audits or generate quick assessment links for prospective clients.</p>
                  
                  <div className="space-y-3">
                    <button className="w-full py-2.5 px-4 rounded-xl bg-[#039BE5] text-black font-semibold text-sm hover:bg-[#0284c7] transition-all shadow-[0_0_15px_rgba(3,155,229,0.3)]">
                      + New GBP Audit
                    </button>
                    <button className="w-full py-2.5 px-4 rounded-xl bg-white/5 text-white font-medium text-sm border border-white/10 hover:bg-white/10 transition-all">
                      Export Client CRM Report
                    </button>
                  </div>
                </div>

                <div className="pt-6 border-t border-white/10 mt-6 text-center">
                  <span className="text-[11px] text-white/40">Powered by GitHub Pages & Tailwind CSS</span>
                </div>
              </div>
            </div>

          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
